<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 강원게임랜드 대표 로고(엠블럼): 금테 두른 붉은 원판 위에 부채꼴로 펼친 화투패 세 장, 앞 장은 해(광) -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#c81e1e"/>
      <stop offset=".65" stop-color="#8b1414"/>
      <stop offset="1" stop-color="#3f0707"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset=".45" stop-color="#f4c95d"/>
      <stop offset="1" stop-color="#b7791f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#f1e7cf"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#6b0f0f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- 원판 + 금테 -->
  <circle cx="128" cy="128" r="122" fill="url(#gold)"/>
  <circle cx="128" cy="128" r="112" fill="url(#disc)"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#f4c95d" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 7"/>

  <!-- 화투패 세 장 (뒤 → 앞) -->
  <g filter="url(#sh)">
    <g transform="rotate(-22 128 196)">
      <rect x="92" y="58" width="72" height="110" rx="9" fill="url(#back)" stroke="#fde68a" stroke-width="4"/>
      <path d="M100 66 l56 94 M112 66 l44 74 M100 86 l40 68" stroke="#fff" stroke-opacity=".18" stroke-width="5"/>
    </g>
    <g transform="rotate(22 128 196)">
      <rect x="92" y="58" width="72" height="110" rx="9" fill="url(#card)" stroke="#b91c1c" stroke-width="4"/>
      <!-- 띠(홍단) -->
      <rect x="116" y="70" width="24" height="70" rx="3" fill="#dc2626"/>
      <path d="M120 82 h16 M120 96 h16 M120 110 h16" stroke="#111" stroke-width="3"/>
    </g>
    <g>
      <rect x="92" y="52" width="72" height="112" rx="9" fill="url(#card)" stroke="#b91c1c" stroke-width="4"/>
      <!-- 해(광) + 산 -->
      <circle cx="128" cy="96" r="22" fill="#dc2626"/>
      <path d="M96 150 q16 -26 32 -18 q14 -20 32 4 v20 q0 4 -4 4 h-56 q-4 0 -4 -4z" fill="#111"/>
      <circle cx="150" cy="70" r="9" fill="#fff" stroke="#dc2626" stroke-width="3"/>
      <text x="150" y="74.5" text-anchor="middle" font-family="serif" font-weight="900" font-size="12" fill="#dc2626">光</text>
    </g>
  </g>

  <!-- 반짝임 -->
  <path d="M206 64 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#fff2b0"/>
  <path d="M52 176 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fff2b0" opacity=".85"/>

  <!-- 아래 리본 -->
  <path d="M40 200 q88 34 176 0 l-8 22 q-80 28 -160 0z" fill="url(#gold)" stroke="#7c2d12" stroke-width="2"/>
  <path d="M60 206 q68 22 136 0" fill="none" stroke="#7c2d12" stroke-opacity=".5" stroke-width="2"/>
</svg>
